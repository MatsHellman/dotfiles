# Unbind the default tmux CTRL+B prefix as my head is locked on Screen
unbind C-b
set -g prefix C-a
bind-key C-a last-window
bind a send-prefix
# reload config file with r
bind r source-file ~/.tmux.conf

# switch panes with meta and arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable mouse control (click windows) invalid options in some tmux. Mouse on 
# is the only one needed.
#set -g mouse-select-window on
#set -g mouse-select-pane on
#set -g mouse-resize-pane on

# Enable mouse mode
set -g mouse on

# stop renaming windows automatically
set-option -g allow-rename off

# -------------------------------------------------
# DRACULA-STYLE TMUX
# -------------------------------------------------

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282a36,fg=#f8f8f2"

# Left side
set -g status-left-length 50
#set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=#282a36]│"
set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=#282a36]"

# Window tabs
setw -g window-status-format " #[fg=#6272a4]#I:#W "
setw -g window-status-current-format "#[fg=#282a36,bg=#50fa7b,bold] #I:#W "

# Right side
set -g status-right-length 100
#set -g status-right "#[fg=#6272a4]#H │ #(whoami) │ %Y-%m-%d %H:%M "
set -g status-right "#[fg=#6272a4]%H:%M"
# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# Messages
set -g message-style "bg=#44475a,fg=#f8f8f2"

# Command line
set -g message-command-style "bg=#44475a,fg=#ff79c6"

# Copy mode
setw -g mode-style "bg=#44475a,fg=#f8f8f2"

# Optional: subtle activity
setw -g monitor-activity on
set -g visual-activity off
